{% load static %}
<!DOCTYPE html>
<html class="dark font-cairo" lang="ar" dir="rtl" 
      x-data="{
          lang: localStorage.getItem('app_lang') || 'ar',
          themeMode: localStorage.getItem('theme') || 'system',
          showAnnouncement: localStorage.getItem('hide_banner_v1') !== 'true',
          translations: {},
          mobileMenuOpen: false,
          themeMenuOpen: false,
          closeAnnouncement() {
              this.showAnnouncement = false;
              localStorage.setItem('hide_banner_v1', 'true');
          },
          async init() {
              this.applyTheme(this.themeMode);
              await this.loadLang(this.lang);
              
              window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
                  if (this.themeMode === 'system') {
                      this.applyTheme('system');
                  }
              });
          },
          setTheme(mode) {
              this.themeMode = mode;
              localStorage.setItem('theme', mode);
              this.applyTheme(mode);
              this.themeMenuOpen = false;
          },
          applyTheme(mode) {
              const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
              const isDark = (mode === 'dark') || (mode === 'system' && prefersDark);
              if (isDark) {
                  document.documentElement.classList.add('dark');
              } else {
                  document.documentElement.classList.remove('dark');
              }
          },
          async toggleLang() {
              this.lang = (this.lang === 'ar') ? 'en' : 'ar';
              localStorage.setItem('app_lang', this.lang);
              await this.loadLang(this.lang);
          },
          async loadLang(l) {
              try {
                  const cached = localStorage.getItem('codeplus_i18n_' + l);
                  if (cached) {
                      try { this.translations = JSON.parse(cached); } catch(err) {}
                  }
                  document.documentElement.setAttribute('lang', l);
                  document.documentElement.setAttribute('dir', l === 'ar' ? 'rtl' : 'ltr');
                  const currentThemeClass = document.documentElement.classList.contains('dark') ? 'dark' : '';
                  document.documentElement.className = currentThemeClass + ' ' + (l === 'ar' ? 'font-cairo' : 'font-geist');

                  const res = await fetch('/static/translations/' + l + '.json');
                  if (res.ok) {
                      const data = await res.json();
                      this.translations = data;
                      localStorage.setItem('codeplus_i18n_' + l, JSON.stringify(data));
                  }
              } catch(e) { console.error('Error loading i18n file', e); }
          },
          t(key, defaultText) {
              return this.translations[key] || defaultText;
          }
      }">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=5.0" name="viewport"/>
    <title>{% block title %}Code+ | استوديو البرمجيات وحلول الأعمال{% endblock %}</title>
    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}"/>
    
    <!-- Anti-FOUC (Flash of Unstyled Content) Instant Theme Script -->
    <script>
        (function() {
            var saved = localStorage.getItem('theme') || 'system';
            var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (saved === 'dark' || (saved === 'system' && prefersDark)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>

    <!-- High Performance Network Hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Geist:wght@400;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <!-- Alpine.js local for zero network redirect latency -->
    <script defer src="{% static 'js/alpine.min.js' %}"></script>

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "background": "var(--bg-color)",
                        "surface": "var(--surface-color)",
                        "surface-container": "var(--surface-container)",
                        "primary": "#6366f1",
                        "primary-hover": "#4f46e5",
                        "secondary": "#0284c7",
                        "on-surface": "var(--text-main)",
                        "on-surface-variant": "var(--text-muted)",
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                        geist: ['Geist', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg-color: #f8fafc;
            --surface-color: #ffffff;
            --surface-container: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-color: #e2e8f0;
            --glass-bg: #ffffff;
            --glass-border: #cbd5e1;
            --shadow-card: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }
        .dark {
            --bg-color: #0e131f;
            --surface-color: #0e131f;
            --surface-container: #1a202c;
            --text-main: #dde2f3;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.1);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --shadow-card: 0 0 20px rgba(0, 0, 0, 0.2);
        }
        html {
            scroll-behavior: smooth;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        html, body {
            overflow-x: hidden;
            max-width: 100vw;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        /* Modern Sleek Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 9999px;
            border: 2px solid var(--bg-color);
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #334155;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6366f1;
        }

        /* Fluid Glass Card & Spring Physics */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-card);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), 
                        box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1), 
                        border-color 0.3s ease, 
                        background-color 0.3s ease;
            will-change: transform, box-shadow;
        }
        .glass-card:hover {
            border-color: rgba(99, 102, 241, 0.35);
        }
        .interactive-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 35px -10px rgba(99, 102, 241, 0.15), 0 10px 15px -5px rgba(0, 0, 0, 0.04);
        }
        .dark .interactive-card:hover {
            box-shadow: 0 20px 40px -10px rgba(99, 102, 241, 0.3), 0 0 20px rgba(99, 102, 241, 0.15);
        }

        /* Keyframe Micro-Animations */
        @keyframes float-gentle {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5); }
            70% { box-shadow: 0 0 0 12px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        @keyframes shimmer-slow {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .animate-float {
            animation: float-gentle 4s ease-in-out infinite;
        }
        .animate-float-delayed {
            animation: float-gentle 4s ease-in-out 2s infinite;
        }
        .whatsapp-glow {
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
            animation: pulse-glow 2.5s infinite;
        }
        .glow-hover:hover {
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.25);
        }

        /* Smooth Scroll Reveal System (Hardware-Accelerated) */
        .reveal-init {
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), 
                        transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: opacity, transform;
        }
        .reveal-init.revealed {
            opacity: 1;
            transform: translateY(0);
        }

        img, video, iframe {
            max-width: 100%;
            height: auto;
        }
        [x-cloak] { display: none !important; }

        @media (max-width: 768px) {
            .glass-card {
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
                background: var(--surface-color) !important;
            }
            #tech-bg-canvas {
                display: none !important;
            }
        }

        @media print {
            nav, footer, #tech-bg-canvas, .print\:hidden {
                display: none !important;
            }
            body {
                background: #ffffff !important;
                color: #000000 !important;
            }
            .glass-card {
                background: #ffffff !important;
                border: 1px solid #e2e8f0 !important;
                box-shadow: none !important;
            }
        }
    </style>

    <script>
        (function() {
            const canvas = document.getElementById('tech-bg-canvas');
            if (!canvas || window.innerWidth < 768 || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            const ctx = canvas.getContext('2d', { alpha: true });
            if (!ctx) return;
            
            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;
            let isRunning = true;
            
            let mouse = { x: -1000, y: -1000, radius: 180, radiusSq: 180 * 180 };
            
            window.addEventListener('mousemove', (e) => {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
            }, { passive: true });
            
            window.addEventListener('mouseleave', () => {
                mouse.x = -1000;
                mouse.y = -1000;
            }, { passive: true });
            
            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    if (window.innerWidth < 768) {
                        isRunning = false;
                        return;
                    }
                    width = canvas.width = window.innerWidth;
                    height = canvas.height = window.innerHeight;
                    initParticles();
                }, 200);
            }, { passive: true });

            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    isRunning = false;
                } else {
                    if (!isRunning && window.innerWidth >= 768) {
                        isRunning = true;
                        lastTime = performance.now();
                        requestAnimationFrame(animate);
                    }
                }
            });
            
            let particles = [];
            let squares = [];
            const particleCount = Math.min(Math.floor((width * height) / 22000), 38);
            const squareCount = 8;
            
            class Particle {
                constructor() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.vx = (Math.random() - 0.5) * 0.65;
                    this.vy = (Math.random() - 0.5) * 0.65;
                    this.radius = Math.random() * 2 + 1.2;
                    this.isGreen = Math.random() > 0.55;
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    if (this.x < 0 || this.x > width) this.vx *= -1;
                    if (this.y < 0 || this.y > height) this.vy *= -1;
                }
                draw(isDark) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    if (isDark) {
                        ctx.fillStyle = this.isGreen ? 'rgba(16, 185, 129, 0.85)' : 'rgba(99, 102, 241, 0.85)';
                    } else {
                        ctx.fillStyle = this.isGreen ? 'rgba(5, 150, 105, 0.65)' : 'rgba(79, 70, 229, 0.65)';
                    }
                    ctx.fill();
                }
            }

            class FloatingSquare {
                constructor() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.size = Math.random() * 22 + 10;
                    this.vx = (Math.random() - 0.5) * 0.4;
                    this.vy = (Math.random() - 0.5) * 0.4;
                    this.angle = Math.random() * Math.PI * 2;
                    this.vAngle = (Math.random() - 0.5) * 0.01;
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.angle += this.vAngle;
                    if (this.x < -40 || this.x > width + 40) this.vx *= -1;
                    if (this.y < -40 || this.y > height + 40) this.vy *= -1;
                }
                draw(isDark) {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.angle);
                    ctx.beginPath();
                    ctx.rect(-this.size / 2, -this.size / 2, this.size, this.size);
                    ctx.lineWidth = 1;
                    if (isDark) {
                        ctx.strokeStyle = 'rgba(16, 185, 129, 0.22)';
                        ctx.fillStyle = 'rgba(99, 102, 241, 0.03)';
                    } else {
                        ctx.strokeStyle = 'rgba(79, 70, 229, 0.16)';
                        ctx.fillStyle = 'rgba(16, 185, 129, 0.02)';
                    }
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();
                }
            }

            function initParticles() {
                particles = [];
                squares = [];
                for (let i = 0; i < particleCount; i++) {
                    particles.push(new Particle());
                }
                for (let i = 0; i < squareCount; i++) {
                    squares.push(new FloatingSquare());
                }
            }

            initParticles();

            const maxDist = 135;
            const maxDistSq = maxDist * maxDist;
            let lastTime = 0;
            const targetFpsInterval = 1000 / 36; // Silky-smooth 36 FPS capped background thread saving CPU/GPU

            function animate(now) {
                if (!isRunning) return;
                requestAnimationFrame(animate);

                if (now - lastTime < targetFpsInterval) return;
                lastTime = now - ((now - lastTime) % targetFpsInterval);

                const isDark = document.documentElement.classList.contains('dark');
                ctx.clearRect(0, 0, width, height);

                // Draw Floating Squares
                for (let i = 0; i < squares.length; i++) {
                    squares[i].update();
                    squares[i].draw(isDark);
                }

                // Draw Connecting Threads (fast squared distance)
                const pLen = particles.length;
                for (let i = 0; i < pLen; i++) {
                    const pi = particles[i];
                    for (let j = i + 1; j < pLen; j++) {
                        const pj = particles[j];
                        const dx = pi.x - pj.x;
                        const dy = pi.y - pj.y;
                        const distSq = dx * dx + dy * dy;
                        if (distSq < maxDistSq) {
                            const dist = Math.sqrt(distSq);
                            const alpha = (1 - dist / maxDist) * (isDark ? 0.35 : 0.18);
                            ctx.beginPath();
                            ctx.moveTo(pi.x, pi.y);
                            ctx.lineTo(pj.x, pj.y);
                            ctx.strokeStyle = isDark 
                                ? `rgba(99, 102, 241, ${alpha})`
                                : `rgba(79, 70, 229, ${alpha})`;
                            ctx.lineWidth = 0.85;
                            ctx.stroke();
                        }
                    }
                }

                // Draw Mouse Constellation Connections (fast squared distance)
                if (mouse.x > 0 && mouse.y > 0) {
                    for (let i = 0; i < pLen; i++) {
                        const p = particles[i];
                        const dx = p.x - mouse.x;
                        const dy = p.y - mouse.y;
                        const distSq = dx * dx + dy * dy;
                        if (distSq < mouse.radiusSq) {
                            const dist = Math.sqrt(distSq);
                            const alpha = (1 - dist / mouse.radius) * (isDark ? 0.65 : 0.35);
                            ctx.beginPath();
                            ctx.moveTo(p.x, p.y);
                            ctx.lineTo(mouse.x, mouse.y);
                            ctx.strokeStyle = isDark 
                                ? `rgba(16, 185, 129, ${alpha})` 
                                : `rgba(5, 150, 105, ${alpha})`;
                            ctx.lineWidth = 1.25;
                            ctx.stroke();
                        }
                    }
                }

                // Draw Particles (Stars/Nodes)
                for (let i = 0; i < pLen; i++) {
                    particles[i].update();
                    particles[i].draw(isDark);
                }
            }

            requestAnimationFrame(animate);
        })();

        // Smooth Scroll-Reveal System with zero layout-thrashing
        (function() {
            if (typeof IntersectionObserver === 'undefined') return;
            const revealObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('revealed');
                        observer.unobserve(entry.target);
                    }
                });
            }, {
                rootMargin: '0px 0px -50px 0px',
                threshold: 0.1
            });

            function observeElements() {
                const candidates = document.querySelectorAll('section, .glass-card, .grid > div, main header, main h1, main h2');
                candidates.forEach((el, index) => {
                    if (!el.classList.contains('reveal-init')) {
                        el.classList.add('reveal-init');
                        if (index % 4 !== 0) {
                            el.style.transitionDelay = `${(index % 4) * 80}ms`;
                        }
                        revealObserver.observe(el);
                    }
                });
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', observeElements);
            } else {
                observeElements();
            }
        })();
    </script>
