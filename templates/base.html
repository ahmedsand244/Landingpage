{% load static %}
<!DOCTYPE html>
<html class="dark font-cairo" lang="ar" dir="rtl" 
      x-data="{
          lang: localStorage.getItem('app_lang') || 'ar',
          themeMode: localStorage.getItem('theme') || 'system',
          showAnnouncement: localStorage.getItem('hide_banner_v1') !== 'true',
          translations: {},
          mobileMenuOpen: false,
          themeMenuOpen: false,
          closeAnnouncement() {
              this.showAnnouncement = false;
              localStorage.setItem('hide_banner_v1', 'true');
          },
          async init() {
              this.applyTheme(this.themeMode);
              await this.loadLang(this.lang);
              
              window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
                  if (this.themeMode === 'system') {
                      this.applyTheme('system');
                  }
              });
          },
          setTheme(mode) {
              this.themeMode = mode;
              localStorage.setItem('theme', mode);
              this.applyTheme(mode);
              this.themeMenuOpen = false;
          },
          applyTheme(mode) {
              const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
              const isDark = (mode === 'dark') || (mode === 'system' && prefersDark);
              if (isDark) {
                  document.documentElement.classList.add('dark');
              } else {
                  document.documentElement.classList.remove('dark');
              }
          },
          async toggleLang() {
              this.lang = (this.lang === 'ar') ? 'en' : 'ar';
              localStorage.setItem('app_lang', this.lang);
              await this.loadLang(this.lang);
          },
          async loadLang(l) {
              try {
                  const res = await fetch('/static/translations/' + l + '.json');
                  this.translations = await res.json();
                  document.documentElement.setAttribute('lang', l);
                  document.documentElement.setAttribute('dir', l === 'ar' ? 'rtl' : 'ltr');
                  const currentThemeClass = document.documentElement.classList.contains('dark') ? 'dark' : '';
                  document.documentElement.className = currentThemeClass + ' ' + (l === 'ar' ? 'font-cairo' : 'font-geist');
              } catch(e) { console.error('Error loading i18n file', e); }
          },
          t(key, defaultText) {
              return this.translations[key] || defaultText;
          }
      }">
<head>

    <!-- Anti-FOUC (Flash of Unstyled Content) Instant Theme Script -->
    <script>
        (function() {
            var saved = localStorage.getItem('theme') || 'system';
            var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (saved === 'dark' || (saved === 'system' && prefersDark)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>

    <script id="tailwind-config">

                        "surface-container": "var(--surface-container)",

                        "primary-hover": "#4f46e5",
                        "secondary": "#0284c7",
                        "on-surface": "var(--text-main)",
                        "on-surface-variant": "var(--text-muted)",
                    },
                    fontFamily: {

        :root {
            --bg-color: #f8fafc;
            --surface-color: #ffffff;
            --surface-container: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-color: #e2e8f0;
            --glass-bg: #ffffff;
            --glass-border: #cbd5e1;
            --shadow-card: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }
        .dark {
            --bg-color: #0e131f;
            --surface-color: #0e131f;
            --surface-container: #1a202c;
            --text-main: #dde2f3;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.1);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --shadow-card: 0 0 20px rgba(0, 0, 0, 0.2);

        body {

            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-card);
            transition: background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .glow-hover:hover {
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.25);

        .whatsapp-glow {

        }
        img, video, iframe {
            max-width: 100%;
            height: auto;
        }
        [x-cloak] { display: none !important; }

        @media (max-width: 768px) {
            .glass-card {
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
                background: var(--surface-color) !important;
            }
            #tech-bg-canvas {
                display: none !important;
            }
        }

        @media print {
            nav, footer, #tech-bg-canvas, .print\:hidden {
                display: none !important;
            }
            body {
                background: #ffffff !important;
                color: #000000 !important;
            }
            .glass-card {
                background: #ffffff !important;
                border: 1px solid #e2e8f0 !important;
                box-shadow: none !important;
            }
        }
    </style>

    <script>
        (function() {
            const canvas = document.getElementById('tech-bg-canvas');
            if (!canvas || window.innerWidth < 768) return;
            const ctx = canvas.getContext('2d');
            
            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;
            
            let mouse = { x: -1000, y: -1000, radius: 180 };
            
            window.addEventListener('mousemove', (e) => {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
            });
            
            window.addEventListener('mouseleave', () => {
                mouse.x = -1000;
                mouse.y = -1000;
            });
            
            window.addEventListener('resize', () => {
                if (window.innerWidth < 768) return;
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
                initParticles();
            });
            
            let particles = [];
            let squares = [];
            const particleCount = Math.min(Math.floor((width * height) / 18000), 50);
            const squareCount = 10;
            
            class Particle {
                constructor() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.vx = (Math.random() - 0.5) * 0.7;
                    this.vy = (Math.random() - 0.5) * 0.7;
                    this.radius = Math.random() * 2 + 1.2;
                    this.isGreen = Math.random() > 0.55;
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    if (this.x < 0 || this.x > width) this.vx *= -1;
                    if (this.y < 0 || this.y > height) this.vy *= -1;
                }
                draw(isDark) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    if (isDark) {
                        ctx.fillStyle = this.isGreen ? 'rgba(16, 185, 129, 0.85)' : 'rgba(99, 102, 241, 0.85)';
                    } else {
                        ctx.fillStyle = this.isGreen ? 'rgba(5, 150, 105, 0.65)' : 'rgba(79, 70, 229, 0.65)';
                    }
                    ctx.fill();
                }
            }

            class FloatingSquare {
                constructor() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.size = Math.random() * 24 + 10;
                    this.vx = (Math.random() - 0.5) * 0.45;
                    this.vy = (Math.random() - 0.5) * 0.45;
                    this.angle = Math.random() * Math.PI * 2;
                    this.vAngle = (Math.random() - 0.5) * 0.012;
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.angle += this.vAngle;
                    if (this.x < -40 || this.x > width + 40) this.vx *= -1;
                    if (this.y < -40 || this.y > height + 40) this.vy *= -1;
                }
                draw(isDark) {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.angle);
                    ctx.beginPath();
                    ctx.rect(-this.size / 2, -this.size / 2, this.size, this.size);
                    ctx.lineWidth = 1;
                    if (isDark) {
                        ctx.strokeStyle = 'rgba(16, 185, 129, 0.22)';
                        ctx.fillStyle = 'rgba(99, 102, 241, 0.03)';
                    } else {
                        ctx.strokeStyle = 'rgba(79, 70, 229, 0.16)';
                        ctx.fillStyle = 'rgba(16, 185, 129, 0.02)';
                    }
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();
                }
            }

            function initParticles() {
                particles = [];
                squares = [];
                for (let i = 0; i < particleCount; i++) {
                    particles.push(new Particle());
                }
                for (let i = 0; i < squareCount; i++) {
                    squares.push(new FloatingSquare());
                }
            }

            initParticles();

            function animate() {
                const isDark = document.documentElement.classList.contains('dark');
                ctx.clearRect(0, 0, width, height);

                // Draw Floating Squares
                squares.forEach(s => {
                    s.update();
                    s.draw(isDark);
                });

                // Draw Connecting Threads
                const maxDist = 135;
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.hypot(dx, dy);
                        if (dist < maxDist) {
                            const alpha = (1 - dist / maxDist) * (isDark ? 0.35 : 0.18);
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = isDark 
                                ? `rgba(99, 102, 241, ${alpha})`
                                : `rgba(79, 70, 229, ${alpha})`;
                            ctx.lineWidth = 0.85;
                            ctx.stroke();
                        }
                    }
                }

                // Draw Mouse Constellation Connections
                if (mouse.x > 0 && mouse.y > 0) {
                    for (let p of particles) {
                        const dx = p.x - mouse.x;
                        const dy = p.y - mouse.y;
                        const dist = Math.hypot(dx, dy);
                        if (dist < mouse.radius) {
                            const alpha = (1 - dist / mouse.radius) * (isDark ? 0.65 : 0.35);
                            ctx.beginPath();
                            ctx.moveTo(p.x, p.y);
                            ctx.lineTo(mouse.x, mouse.y);
                            ctx.strokeStyle = isDark 
                                ? `rgba(16, 185, 129, ${alpha})` 
                                : `rgba(5, 150, 105, ${alpha})`;
                            ctx.lineWidth = 1.25;
                            ctx.stroke();
                        }
                    }
                }

                // Draw Particles (Stars/Nodes)
                particles.forEach(p => {
                    p.update();
                    p.draw(isDark);
                });

                requestAnimationFrame(animate);
            }

            animate();
        })();
    </script>
</body>
</html>
