<!DOCTYPE html>
<html class="dark font-cairo" lang="ar" dir="rtl" 
      x-data="{
          lang: localStorage.getItem('app_lang') || 'ar',
          themeMode: localStorage.getItem('theme') || 'system',
          translations: {},
          mobileMenuOpen: false,
          themeMenuOpen: false,
          async init() {
              this.applyTheme(this.themeMode);
              await this.loadLang(this.lang);
              
              window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
                  if (this.themeMode === 'system') {
                      this.applyTheme('system');
                  }
              });
          },
          setTheme(mode) {
              this.themeMode = mode;
              localStorage.setItem('theme', mode);
              this.applyTheme(mode);
              this.themeMenuOpen = false;
          },
          applyTheme(mode) {
              const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
              const isDark = (mode === 'dark') || (mode === 'system' && prefersDark);
              if (isDark) {
                  document.documentElement.classList.add('dark');
              } else {
                  document.documentElement.classList.remove('dark');
              }
          },
          async toggleLang() {
              this.lang = (this.lang === 'ar') ? 'en' : 'ar';
              localStorage.setItem('app_lang', this.lang);
              await this.loadLang(this.lang);
          },
          async loadLang(l) {
              try {
                  const res = await fetch('/static/translations/' + l + '.json');
                  this.translations = await res.json();
                  document.documentElement.setAttribute('lang', l);
                  document.documentElement.setAttribute('dir', l === 'ar' ? 'rtl' : 'ltr');
                  const currentThemeClass = document.documentElement.classList.contains('dark') ? 'dark' : '';
                  document.documentElement.className = currentThemeClass + ' ' + (l === 'ar' ? 'font-cairo' : 'font-geist');
              } catch(e) { console.error('Error loading i18n file', e); }
          },
          t(key, defaultText) {
              return this.translations[key] || defaultText;
          }
      }">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=5.0" name="viewport"/>
    <title>{% block title %}استوديو البرمجيات وحلول الأعمال | Business Software Studio{% endblock %}</title>
    
    <!-- Anti-FOUC (Flash of Unstyled Content) Instant Theme Script -->
    <script>
        (function() {
            var saved = localStorage.getItem('theme') || 'system';
            var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (saved === 'dark' || (saved === 'system' && prefersDark)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Geist:wght@400;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <!-- Alpine.js for frontend state & i18n & theme switcher -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "background": "var(--bg-color)",
                        "surface": "var(--surface-color)",
                        "surface-container": "var(--surface-container)",
                        "primary": "#6366f1",
                        "primary-hover": "#4f46e5",
                        "secondary": "#0284c7",
                        "on-surface": "var(--text-main)",
                        "on-surface-variant": "var(--text-muted)",
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                        geist: ['Geist', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg-color: #f8fafc;
            --surface-color: #ffffff;
            --surface-container: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-color: #e2e8f0;
            --glass-bg: #ffffff;
            --glass-border: #cbd5e1;
            --shadow-card: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }
        .dark {
            --bg-color: #0e131f;
            --surface-color: #0e131f;
            --surface-container: #1a202c;
            --text-main: #dde2f3;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.1);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --shadow-card: 0 0 20px rgba(0, 0, 0, 0.2);
        }
        html, body {
            overflow-x: hidden;
            max-width: 100vw;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-card);
            transition: background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .glow-hover:hover {
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.25);
        }
        .whatsapp-glow {
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
            animation: pulse-glow 2s infinite;
        }
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        img, video, iframe {
            max-width: 100%;
            height: auto;
        }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col antialiased overflow-x-hidden max-w-full">

    <!-- TopNavBar -->
    <nav class="bg-surface/90 backdrop-blur-md sticky top-0 border-b border-slate-200 dark:border-white/10 shadow-sm z-50 transition-all">
        <div class="flex justify-between items-center w-full px-4 md:px-8 h-20 max-w-[1440px] mx-auto">
            <!-- Brand Logo -->
            <a href="/" class="text-lg md:text-xl font-bold tracking-tight text-on-surface flex items-center gap-2 hover:opacity-80 transition-opacity min-h-[44px]">
                <span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">terminal</span>
                <span x-text="t('nav_brand', 'Studio | حلول البرمجيات والأعمال')"></span>
            </a>
            
            <!-- Desktop Navigation Menu (4 Links) -->
            <div class="hidden md:flex items-center gap-6 font-semibold text-sm">
                <a class="px-3 py-2 rounded-lg transition-colors min-h-[44px] flex items-center {% if request.path == '/' %}text-primary bg-primary/10{% else %}text-on-surface-variant hover:text-on-surface hover:bg-slate-200/50 dark:hover:bg-white/5{% endif %}" href="/" x-text="t('nav_home', 'الرئيسية')"></a>
                <a class="px-3 py-2 rounded-lg transition-colors min-h-[44px] flex items-center {% if '/portfolio' in request.path %}text-primary bg-primary/10{% else %}text-on-surface-variant hover:text-on-surface hover:bg-slate-200/50 dark:hover:bg-white/5{% endif %}" href="/portfolio/" x-text="t('nav_portfolio', 'المشاريع والأعمال')"></a>
                <a class="px-3 py-2 rounded-lg transition-colors min-h-[44px] flex items-center {% if '/services' in request.path %}text-primary bg-primary/10{% else %}text-on-surface-variant hover:text-on-surface hover:bg-slate-200/50 dark:hover:bg-white/5{% endif %}" href="/services/" x-text="t('nav_services', 'الخدمات والتقنيات')"></a>
                <a class="px-3 py-2 rounded-lg transition-colors min-h-[44px] flex items-center {% if '/contact' in request.path %}text-primary bg-primary/10{% else %}text-on-surface-variant hover:text-on-surface hover:bg-slate-200/50 dark:hover:bg-white/5{% endif %}" href="/contact/" x-text="t('nav_contact', 'تواصل معنا')"></a>
            </div>

            <!-- Action Buttons: WhatsApp CTA + Language Switcher + Theme Switcher -->
            <div class="hidden md:flex items-center gap-3">
                
                <!-- Theme Switcher Dropdown Component -->
                <div class="relative" @click.outside="themeMenuOpen = false">
                    <button @click="themeMenuOpen = !themeMenuOpen" class="glass-card border border-primary/30 px-3 py-2 rounded-full text-xs font-bold text-on-surface hover:bg-slate-200/50 dark:hover:bg-white/10 transition-all flex items-center gap-1.5 active:scale-95 min-h-[44px]" title="تغيير المظهر / Theme">
                        <span class="material-symbols-outlined text-base text-amber-500" x-show="themeMode === 'light'">light_mode</span>
                        <span class="material-symbols-outlined text-base text-primary" x-show="themeMode === 'dark'">dark_mode</span>
                        <span class="material-symbols-outlined text-base text-emerald-500" x-show="themeMode === 'system'">desktop_windows</span>
                        <span class="material-symbols-outlined text-sm">expand_more</span>
                    </button>

                    <!-- Theme Menu Dropdown -->
                    <div x-show="themeMenuOpen" x-transition class="absolute right-0 mt-2 w-36 glass-card rounded-2xl p-1.5 shadow-xl border border-slate-200 dark:border-white/10 z-50 space-y-1">
                        <button @click="setTheme('light')" class="w-full px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-2 hover:bg-slate-100 dark:hover:bg-white/10 transition-colors min-h-[40px]" :class="themeMode === 'light' ? 'text-primary bg-primary/10' : 'text-on-surface'">
                            <span class="material-symbols-outlined text-base text-amber-500">light_mode</span>
                            <span>نهار (Light)</span>
                        </button>
                        <button @click="setTheme('dark')" class="w-full px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-2 hover:bg-slate-100 dark:hover:bg-white/10 transition-colors min-h-[40px]" :class="themeMode === 'dark' ? 'text-primary bg-primary/10' : 'text-on-surface'">
                            <span class="material-symbols-outlined text-base text-primary">dark_mode</span>
                            <span>ليل (Dark)</span>
                        </button>
                        <button @click="setTheme('system')" class="w-full px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-2 hover:bg-slate-100 dark:hover:bg-white/10 transition-colors min-h-[40px]" :class="themeMode === 'system' ? 'text-primary bg-primary/10' : 'text-on-surface'">
                            <span class="material-symbols-outlined text-base text-emerald-500">desktop_windows</span>
                            <span>تلقائي (OS)</span>
                        </button>
                    </div>
                </div>

                <!-- Language Switcher Toggle Button -->
                <button @click="toggleLang()" class="glass-card border border-primary/30 px-3.5 py-2 rounded-full text-xs font-bold text-on-surface hover:bg-slate-200/50 dark:hover:bg-white/10 transition-all flex items-center gap-1.5 active:scale-95 min-h-[44px]">
                    <span class="material-symbols-outlined text-base text-primary">language</span>
                    <span x-text="lang === 'ar' ? 'English' : 'العربية'"></span>
                </button>

                <a href="https://wa.me/201554397407?text=أهلاً%20بكم،%20أود%20الاستفسار%20عن%20تطوير%20مشروع%20برمجي%20/%20تطبيق%20بزنس" target="_blank" class="bg-[#10B981] hover:bg-[#059669] text-white px-5 py-2.5 rounded-full font-bold text-sm flex items-center gap-2 whatsapp-glow transition-all active:scale-95 min-h-[44px]">
                    <span class="material-symbols-outlined text-lg">chat</span>
                    <span x-text="t('nav_whatsapp', 'تواصل معنا واتساب')"></span>
                </a>
            </div>

            <!-- Mobile Menu Toggle & Actions -->
            <div class="flex items-center gap-2 md:hidden">
                <!-- Mobile Theme Toggle -->
                <button @click="setTheme(themeMode === 'dark' ? 'light' : 'dark')" class="glass-card px-3 py-2 rounded-full text-xs font-bold text-on-surface flex items-center gap-1 min-h-[44px]">
                    <span class="material-symbols-outlined text-base text-amber-500" x-show="themeMode !== 'dark'">light_mode</span>
                    <span class="material-symbols-outlined text-base text-primary" x-show="themeMode === 'dark'">dark_mode</span>
                </button>

                <!-- Mobile Lang Toggle -->
                <button @click="toggleLang()" class="glass-card px-3 py-2 rounded-full text-xs font-bold text-on-surface flex items-center gap-1 min-h-[44px]">
                    <span class="material-symbols-outlined text-base text-primary">language</span>
                    <span x-text="lang === 'ar' ? 'EN' : 'عربي'"></span>
                </button>

                <button @click="mobileMenuOpen = !mobileMenuOpen" class="text-on-surface p-2 rounded-lg hover:bg-slate-200/50 dark:hover:bg-white/10 min-h-[44px] min-w-[44px] flex items-center justify-center">
                    <span class="material-symbols-outlined text-3xl" x-text="mobileMenuOpen ? 'close' : 'menu'">menu</span>
                </button>
            </div>
        </div>

        <!-- Mobile Menu Dropdown -->
        <div x-show="mobileMenuOpen" x-transition class="md:hidden border-b border-slate-200 dark:border-white/10 bg-surface-container px-4 py-4 space-y-3">
            <a class="block px-4 py-3 rounded-lg font-semibold min-h-[44px] flex items-center {% if request.path == '/' %}text-primary bg-primary/10{% else %}text-on-surface-variant hover:text-on-surface{% endif %}" href="/" x-text="t('nav_home', 'الرئيسية')"></a>
            <a class="block px-4 py-3 rounded-lg font-semibold min-h-[44px] flex items-center {% if '/portfolio' in request.path %}text-primary bg-primary/10{% else %}text-on-surface-variant hover:text-on-surface{% endif %}" href="/portfolio/" x-text="t('nav_portfolio', 'المشاريع والأعمال')"></a>
            <a class="block px-4 py-3 rounded-lg font-semibold min-h-[44px] flex items-center {% if '/services' in request.path %}text-primary bg-primary/10{% else %}text-on-surface-variant hover:text-on-surface{% endif %}" href="/services/" x-text="t('nav_services', 'الخدمات والتقنيات')"></a>
            <a class="block px-4 py-3 rounded-lg font-semibold min-h-[44px] flex items-center {% if '/contact' in request.path %}text-primary bg-primary/10{% else %}text-on-surface-variant hover:text-on-surface{% endif %}" href="/contact/" x-text="t('nav_contact', 'تواصل معنا')"></a>
            <a href="https://wa.me/201554397407?text=أهلاً%20بكم،%20أود%20الاستفسار%20عن%20تطوير%20مشروع%20برمجي%20/%20تطبيق%20بزنس" target="_blank" class="block w-full text-center bg-[#10B981] text-white py-3 rounded-xl font-bold mt-2 min-h-[44px] flex items-center justify-center gap-2" x-text="t('nav_whatsapp', 'تحدث معنا واتساب مباشرة')"></a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow w-full max-w-full">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-surface-container-lowest border-t border-slate-200 dark:border-white/10 py-12 px-4 md:px-8 mt-16 transition-colors w-full">
        <div class="max-w-[1440px] mx-auto grid grid-cols-1 md:grid-cols-3 gap-8">
            <div>
                <div class="text-xl font-bold text-on-surface flex items-center gap-2 mb-3">
                    <span class="material-symbols-outlined text-primary text-2xl" style="font-variation-settings: 'FILL' 1;">terminal</span>
                    <span x-text="t('nav_brand', 'Studio | حلول البرمجيات والأعمال')"></span>
                </div>
                <p class="text-on-surface-variant text-sm leading-relaxed" x-text="t('hero_desc', 'نطور ونبني حلول البرمجيات وتطبيقات البزنس للشركات والأنشطة التجارية، إلى جانب المشاريع الأكاديمية.')"></p>
            </div>
            
            <div>
                <h4 class="text-on-surface font-bold mb-3 text-base" x-text="t('footer_quick_links', 'روابط سريعة')"></h4>
                <div class="flex flex-col space-y-2 text-sm text-on-surface-variant">
                    <a href="/" class="hover:text-primary transition-colors py-1" x-text="t('nav_home', 'الرئيسية')"></a>
                    <a href="/portfolio/" class="hover:text-primary transition-colors py-1" x-text="t('nav_portfolio', 'معرض المشاريع والأعمال')"></a>
                    <a href="/services/" class="hover:text-primary transition-colors py-1" x-text="t('nav_services', 'خدمات البزنس والتطوير')"></a>
                    <a href="/contact/" class="hover:text-primary transition-colors py-1" x-text="t('nav_contact', 'تواصل معنا')"></a>
                </div>
            </div>

            <div>
                <h4 class="text-on-surface font-bold mb-3 text-base" x-text="t('footer_support', 'الدعم والتواصل المباشر')"></h4>
                <p class="text-sm text-on-surface-variant mb-4" x-text="t('cta_banner_desc', 'هل لديك فكرة تطبيق، نظام بزنس، أو مشروع تخرج؟ تواصل معنا مباشرة:')"></p>
                <a href="https://wa.me/201554397407?text=أهلاً%20بكم،%20أود%20الاستفسار%20عن%20تطوير%20مشروع%20برمجي%20/%20تطبيق%20بزنس" target="_blank" class="inline-flex items-center gap-2 bg-[#10B981] text-white px-4 py-2.5 rounded-lg font-bold text-sm hover:bg-[#059669] transition-colors min-h-[44px]">
                    <span class="material-symbols-outlined text-lg">chat</span>
                    <span>WhatsApp: +20 15 54397407</span>
                </a>
            </div>
        </div>

        <div class="max-w-[1440px] mx-auto border-t border-slate-200 dark:border-white/5 mt-8 pt-6 text-center text-xs text-on-surface-variant" x-text="t('footer_rights', '© 2026 Studio Software & Business Solutions. جميع الحقوق محفوظة.')"></div>
    </footer>

</body>
</html>
