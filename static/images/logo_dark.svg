<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="600" height="180" fill="none">
    <defs>
        <linearGradient id="emeraldGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#34D399"/>
            <stop offset="100%" stop-color="#10B981"/>
        </linearGradient>
        <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#10B981" flood-opacity="0.6"/>
        </filter>
    </defs>

    <!-- Code Text in Pure White for Dark Theme -->
    <text x="30" y="125" font-family="Segoe UI, Cairo, sans-serif" font-size="100" font-weight="900" fill="#FFFFFF" letter-spacing="-2">Code</text>

    <!-- Glowing Vibrant Emerald Plus Symbol -->
    <g fill="url(#emeraldGradDark)" filter="url(#emeraldGlow)">
        <!-- Vertical Bar -->
        <rect x="323" y="35" width="24" height="80" rx="10"/>
        <!-- Horizontal Bar -->
        <rect x="295" y="63" width="80" height="24" rx="10"/>
    </g>

    <!-- Subtle Modern Decorative Pixels -->
    <rect x="400" y="32" width="20" height="20" rx="4" fill="#10B981" opacity="0.9"/>
    <rect x="430" y="60" width="16" height="16" rx="3" fill="#818CF8" opacity="0.8"/>
    <rect x="390" y="85" width="16" height="16" rx="3" fill="#FFFFFF" opacity="0.5"/>
</svg>